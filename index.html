
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gmail Verify Bot</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #10152d, #283d70, #111827);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 20px;
      text-align: center;
      border: 1px solid #ffffff30;
      border-radius: 22px;
      background: #ffffff12;
      box-shadow: 0 15px 45px #0005;
    }

    .logo { font-size: 48px; }

    h1 { font-size: 27px; }

    p {
      color: #d7e2ff;
      line-height: 1.6;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin: 28px 0;
    }

    #result {
      overflow-wrap: anywhere;
      padding: 12px;
      border-radius: 12px;
      background: #0002;
    }

    .note { font-size: 12px; }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">📧</div>
    <h1>Gmail Verify Bot</h1>
    <p>Sign in with your Google account to verify your email.</p>

    <div id="googleButton"></div>
    <p id="result" aria-live="polite">
      Loading Google Sign-in...
    </p>

    <p class="note">
      Sign-in is optional. Only your verified Google email is displayed.
    </p>
  </main>

  <script>
    const CLIENT_ID =
      "188092714545-37jedlku1kqj4u5llp1pjudm14fv7q2t.apps.googleusercontent.com";

    const result = document.getElementById("result");

    function showMessage(message) {
      result.textContent = message;
    }

    function handleCredentialResponse(response) {
      showMessage("Checking your Google account...");

      try {
        const parts = response.credential.split(".");
        const payload = JSON.parse(atob(
          parts[1].replace(/-/g, "+").replace(/_/g, "/")
        ));

        if (
          payload.aud !== CLIENT_ID ||
          payload.email_verified !== true ||
          !payload.email
        ) {
          showMessage("❌ Verification failed. Please try again.");
          return;
        }

        showMessage("✅ Google email verified: " + payload.email);
      } catch (error) {
        showMessage("❌ Could not read the Google sign-in response.");
      }
    }

    function initializeSignIn() {
      if (!window.google?.accounts?.id) {
        setTimeout(initializeSignIn, 300);
        return;
      }

      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "pill",
          width: 280
        }
      );

      showMessage("Tap the button to sign in with Google.");
    }

    initializeSignIn();
  </script>
</body>
  </html>
